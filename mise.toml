[tools]
go = "1.25.6"
"github:a-h/templ" = { version = "0.3.1020", exe = "templ" }

[tasks.generate]
run = "templ generate"

[tasks.build]
description = "Render the static site into public/"
run = "templ generate && go run ./cmd/build"

[tasks.dev]
description = "Live-reload dev server on $DEV_PORT (default 8080); rebuilds on template, Go or static changes"
# templ rebuilds and serves public/ on PORT; its proxy on DEV_PORT injects browser reload.
# Set DEV_BIND=0.0.0.0 to reach it from other machines. Caddy redirects are not applied.
env = { PORT = "7332" }
run = """
templ generate -watch \
  -watch-pattern '(.+\\.go$)|(.+\\.templ$)|(.+_templ\\.txt$)|(/static/[^/]+(/[^/]+)?$)' \
  -ignore-pattern '/public/' \
  -cmd 'go run ./cmd/build -serve' \
  -proxy http://localhost:7332 \
  -proxyport ${DEV_PORT:-8080} -proxybind ${DEV_BIND:-127.0.0.1}
"""

[tasks.resume-pdf]
description = "Regenerate static/resume.pdf with Chromium; commit the result"
run = "templ generate && go run ./cmd/resumepdf"

[tasks.check]
run = "templ fmt -fail . && go vet ./..."

[tasks.docker]
description = "Build and run the production image (Caddy) on port 8080"
run = "docker build -t portfolio . && docker run --rm -p 8080:8080 portfolio"
