[tools]
go = "1.25.6"
"github:a-h/templ" = { version = "0.3.1020", exe = "templ" }

[tasks.generate]
run = "templ generate"

[tasks.dev]
run = "templ generate && go run ./cmd/server"

[tasks.build]
run = "templ generate && go build -o bin/portfolio ./cmd/server"

[tasks.check]
run = "templ fmt -fail . && go vet ./..."
