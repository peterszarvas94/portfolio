[tools]
go = "1.25.6"
"github:a-h/templ" = { version = "0.3.1020", exe = "templ" }

[tasks.generate]
run = "templ generate"

[tasks.build]
description = "Render the static site into public/"
run = "templ generate && go run ./cmd/build"

[tasks.dev]
description = "Build and preview public/ on $PORT (default 8080), without Caddy redirects"
run = "templ generate && go run ./cmd/build -serve"

[tasks.resume-pdf]
description = "Regenerate static/resume.pdf with Chromium; commit the result"
run = "templ generate && go run ./cmd/resumepdf"

[tasks.check]
run = "templ fmt -fail . && go vet ./..."

[tasks.docker]
description = "Build and run the production image (Caddy) on port 8080"
run = "docker build -t portfolio . && docker run --rm -p 8080:8080 portfolio"
